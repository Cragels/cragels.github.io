    <!-- Click-to-enlarge viewer -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" hidden>
        <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
        <figure>
            <img id="lightbox-img" src="" alt="">
            <figcaption id="lightbox-caption"></figcaption>
        </figure>
    </div>

    <script>
        (function () {
        var box = document.getElementById('lightbox');
        var img = document.getElementById('lightbox-img');
        var cap = document.getElementById('lightbox-caption');
        function close() { box.hidden = true; img.src = ''; document.body.classList.remove('no-scroll'); }
        document.querySelectorAll('.gallery img').forEach(function (el) {
        el.addEventListener('click', function () {
        var fig = el.closest('figure');
        img.src = el.src;
        img.alt = el.alt;
        cap.innerHTML = fig && fig.querySelector('figcaption') ? fig.querySelector('figcaption').innerHTML : '';
        box.hidden = false;
        document.body.classList.add('no-scroll');
        });
        });
        box.addEventListener('click', function (e) { if (e.target !== img) close(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) close(); });
        })();
    </script>
